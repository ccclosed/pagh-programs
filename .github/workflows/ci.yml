name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ccclosed/pagh-api
          path: pagh-api
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --target riscv64gc-unknown-none-elf
      - name: Build paghbox (sibling pagh-api checkout)
        run: |
          rm -rf ../pagh-api && ln -s "$GITHUB_WORKSPACE/pagh-api" ../pagh-api
          cargo build --release --target riscv64gc-unknown-none-elf
      - name: Build and verify the package repository
        run: |
          python3 tools/build_repo.py --elf target/riscv64gc-unknown-none-elf/release/paghbox
          python3 tools/build_repo.py --check
      - name: Check the documentation figures against the code
        run: python3 tools/check_docs.py
