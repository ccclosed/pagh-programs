name: release

# Tag-driven GitHub releases. New tags must match the strict pattern
# `vX.Y.Z` or `vX.Y.Z-rc.N`; anything else — bare `X.Y.Z`, `-pre.N`, trailing
# junk — is rejected:
#
#   stable      vX.Y.Z       must be reachable from `main`  -> Release
#   pre-release vX.Y.Z-rc.N  must be reachable from `dev` AND not from `main`
#                            -> Pre-release (release-candidate lane only)
#
# The base version
# `X.Y.Z` must equal `programs/Cargo.toml`'s `[package].version` for paghbox
# (see `VERSION_FILE`): the tag is not allowed to disagree with the applet
# bundle the tree actually builds. Every release gets a source archive and a
# `.sha256` next to it.
#
# Nothing binary is attached to a pagh-programs release: paghbox is built
# against the sibling pagh-api checkout and packaged by `tools/build_repo.py`.
# The resulting `.ppkg` is published to pagh-repo, and only from a stable
# release on `main` (see RELEASING.md).
#
# Old bare-numeric tags remain as history only and are never rewritten; the
# trigger below still catches a bare tag so the strict check can reject it. New
# tags must be `vX.Y.Z` or `vX.Y.Z-rc.N`, and a rejected tag creates no release.

on:
  push:
    tags:
      - 'v*'
      # Historical bare tags: kept so a mistaken new bare tag is explicitly
      # rejected by the check below instead of being silently ignored.
      - '[0-9]*'

permissions:
  contents: write

env:
  VERSION_FILE: programs/Cargo.toml

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag branch and version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main dev
          tag="${GITHUB_REF_NAME}"
          base="${tag#v}"
          base="${base%%-*}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::new tags must match vX.Y.Z or vX.Y.Z-rc.N exactly (got $tag)"; exit 1
          fi
          if [[ "$tag" =~ -rc\.[0-9]+$ ]]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/dev || {
              echo "::error::pre-release $tag must be reachable from dev"; exit 1; }
            if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::pre-release $tag must not point at a commit already on main"; exit 1
            fi
          else
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
              echo "::error::stable release $tag must be reachable from main"; exit 1; }
          fi
          if [ -f "$VERSION_FILE" ]; then
            version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' "$VERSION_FILE" | head -n1)"
          elif [ -f VERSION ]; then
            version="$(tr -d '[:space:]' < VERSION)"
          else
            echo "::error::no version source at $VERSION_FILE"; exit 1
          fi
          if [ -z "$version" ] || [ "$version" != "$base" ]; then
            echo "::error::tag base $base does not match version source $VERSION_FILE ($version)"; exit 1
          fi
          echo "tag=$tag version=$version" >> "$GITHUB_STEP_SUMMARY"

      # The applet count and the paghbox version quoted in README.md,
      # catalog.md and docs/package-format.md are release-facing figures; the
      # tag must not ship a tree whose documentation disagrees with the code.
      - name: Check the version and applet documentation figures
        run: python3 tools/check_docs.py

      - name: Create source archive and checksums
        shell: bash
        run: |
          set -euo pipefail
          name="$(basename "$GITHUB_REPOSITORY")-${GITHUB_REF_NAME}.tar.gz"
          git archive --format=tar.gz --prefix="${GITHUB_REF_NAME}/" -o "$name" "$GITHUB_SHA"
          sha256sum "$name" > "$name.sha256"
          echo "ARCHIVE=$name" >> "$GITHUB_ENV"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          generate_release_notes: true
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256